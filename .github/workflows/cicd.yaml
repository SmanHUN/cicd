name: Python Ci/Cd
on: [push, pull_request]

jobs:
  run-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Up Python
        uses: actions/stepup-Python@v5
        with:
          Python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run pytest
        run: pytest
      - name: Test.main.py
        run: Python main.py
